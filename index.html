<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover"
		/>
		<meta name="theme-color" content="#1f5f5b" />
		<title>Event Poster Builder</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Playfair+Display:wght@700;800;900&family=Noto+Sans+Sinhala:wght@500;700&display=swap"
			rel="stylesheet"
		/>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
		<style>
			:root {
				--ink: #1b2430;
				--muted: #6b7686;
				--line: #dfe4ea;
				--bg: #eceff3;
				--accent: #1f5f5b;
				--accent-dark: #164744;
				--danger: #b3372f;
			}
			* {
				box-sizing: border-box;
			}
			html,
			body {
				margin: 0;
				height: 100%;
			}
			body {
				font-family:
					"Segoe UI",
					system-ui,
					-apple-system,
					Roboto,
					Helvetica,
					Arial,
					sans-serif;
				background: var(--bg);
				color: var(--ink);
			}

			.app {
				display: grid;
				grid-template-columns: 400px 1fr;
				height: 100vh;
			}
			.left {
				background: #fff;
				border-right: 1px solid var(--line);
				overflow-y: auto;
				padding: 28px 26px 40px;
			}
			.right {
				overflow: auto;
				padding: 28px 20px 48px;
			}
			.stage {
				display: flex;
				justify-content: center;
			}

			h2 {
				font-size: 20px;
				margin: 0 0 4px;
				letter-spacing: -0.01em;
			}
			.sub {
				color: var(--muted);
				font-size: 13px;
				margin: 0 0 22px;
			}
			.field {
				margin-bottom: 20px;
			}
			label.lbl,
			.lbl {
				display: block;
				font-size: 13px;
				font-weight: 600;
				margin-bottom: 7px;
			}
			input[type="text"],
			input[type="date"],
			textarea {
				width: 100%;
				font: inherit;
				font-size: 14px;
				padding: 10px 12px;
				border: 1px solid var(--line);
				border-radius: 8px;
				background: #fff;
				color: var(--ink);
				transition:
					border-color 0.15s,
					box-shadow 0.15s;
			}
			textarea {
				min-height: 110px;
				resize: vertical;
				line-height: 1.5;
			}
			input:focus,
			textarea:focus {
				outline: none;
				border-color: var(--accent);
				box-shadow: 0 0 0 3px rgba(31, 95, 91, 0.15);
			}

			.people {
				display: flex;
				flex-direction: column;
				gap: 6px;
			}
			.person {
				display: flex;
				align-items: center;
				gap: 10px;
				padding: 8px 10px;
				border: 1px solid var(--line);
				border-radius: 8px;
				font-size: 14px;
				cursor: pointer;
			}
			.person:hover {
				background: #f7f9fb;
			}
			.person input {
				width: 17px;
				height: 17px;
				accent-color: var(--accent);
				margin: 0;
			}

			.btn {
				font: inherit;
				font-size: 14px;
				font-weight: 600;
				border: 0;
				border-radius: 8px;
				padding: 10px 16px;
				cursor: pointer;
				transition:
					background 0.15s,
					opacity 0.15s;
			}
			.btn:focus-visible {
				outline: 3px solid rgba(31, 95, 91, 0.35);
				outline-offset: 2px;
			}
			.btn-outline {
				background: #fff;
				color: var(--accent);
				border: 1.5px solid var(--accent);
			}
			.btn-outline:hover {
				background: #eef6f5;
			}
			.btn-outline:disabled {
				opacity: 0.45;
				cursor: not-allowed;
				background: #fff;
			}
			.btn-primary {
				width: 100%;
				background: var(--accent);
				color: #fff;
				padding: 14px 16px;
				font-size: 15px;
			}
			.btn-primary:hover {
				background: var(--accent-dark);
			}
			.btn-primary:disabled {
				opacity: 0.6;
				cursor: wait;
			}
			.count {
				font-size: 12.5px;
				color: var(--muted);
				margin-left: 10px;
			}

			.thumbs {
				display: flex;
				flex-direction: column;
				gap: 8px;
				margin-top: 12px;
			}
			.thumb {
				display: grid;
				grid-template-columns: 64px 1fr;
				gap: 8px 12px;
				align-items: center;
				padding: 8px;
				border: 1px solid var(--line);
				border-radius: 10px;
			}
			.thumb > img {
				width: 64px;
				height: 64px;
				object-fit: cover;
				border-radius: 6px;
			}
			.thumb .nm {
				display: block;
				font-size: 13px;
				font-weight: 600;
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
			}
			.thumb .acts {
				display: flex;
				gap: 6px;
				margin-top: 6px;
			}
			.thumb button {
				font: inherit;
				font-size: 12.5px;
				font-weight: 600;
				border-radius: 6px;
				padding: 6px 10px;
				cursor: pointer;
				background: #fff;
				border: 1px solid var(--line);
				color: var(--ink);
			}
			.thumb button:disabled {
				opacity: 0.35;
				cursor: not-allowed;
			}
			.thumb .rm {
				margin-left: auto;
				border-color: #e7c4c1;
				color: var(--danger);
			}
			.thumb .zrow {
				grid-column: 1/-1;
				display: flex;
				align-items: center;
				gap: 10px;
				font-size: 12.5px;
				color: var(--muted);
			}
			.thumb .zrow input {
				flex: 1;
				accent-color: var(--accent);
				min-width: 0;
			}
			#fileInput {
				display: none;
			}
			.note {
				font-size: 12.5px;
				color: var(--danger);
				min-height: 16px;
				margin-top: 8px;
			}

			/* ---------- A4 page (794 x 1123 px @96dpi) ---------- */
			.paper {
				width: 794px;
				height: 1123px;
				padding: 0;
				background: #fff;
				flex: none;
				box-shadow:
					0 1px 3px rgba(20, 30, 40, 0.12),
					0 14px 40px rgba(20, 30, 40, 0.16);
			}
			.sheet {
				width: 100%;
				height: 100%;
				display: flex;
				flex-direction: column;
				overflow: hidden;
				padding: 112px 72px 108px;
				background-color: #fbe9a0;
				background-size: 100% 100%;
				background-repeat: no-repeat;
				color: #000;
				text-align: center;
				font-family:
					"Montserrat", "Noto Sans Sinhala", "Segoe UI", Arial, sans-serif;
			}
			.sheet .ev {
				font-family: "Playfair Display", "Noto Sans Sinhala", Georgia, serif;
				font-size: 46px;
				line-height: 1.12;
				font-weight: 900;
				letter-spacing: 0.02em;
				margin: 0;
				overflow-wrap: anywhere;
				text-transform: uppercase;
				color: #000;
			}
			.sheet .date {
				align-self: center;
				margin-top: 14px;
				padding: 7px 26px;
				border-radius: 999px;
				font-size: 17px;
				font-weight: 800;
				letter-spacing: 0.1em;
				text-transform: uppercase;
				color: #ffe9a0;
				background: #000;
			}
			.sheet .doc-title {
				font-family: "Playfair Display", "Noto Sans Sinhala", Georgia, serif;
				font-size: 27px;
				line-height: 1.2;
				font-weight: 900;
				margin: 24px 0 0;
				overflow-wrap: anywhere;
				color: #000;
			}
			.sheet .bar {
				height: 4px;
				width: 100%;
				background: #000;
				margin: 10px 0 14px;
				border-radius: 2px;
				flex: none;
			}
			.sheet .doc-desc {
				font-size: 16px;
				line-height: 1.6;
				font-weight: 600;
				white-space: pre-wrap;
				overflow-wrap: anywhere;
				margin: 0;
				color: #000;
			}
			.sheet .sec {
				align-self: center;
				font-size: 14px;
				font-weight: 800;
				letter-spacing: 0.22em;
				text-transform: uppercase;
				margin: 18px 0 8px;
				padding: 0 14px 5px;
				border-bottom: 2px solid #000;
				flex: none;
				color: #000;
			}
			.sheet ol {
				width: fit-content;
				margin: 0 auto;
				padding-left: 26px;
				font-size: 17px;
				line-height: 1.55;
				font-weight: 700;
				text-align: left;
				color: #000;
			}
			.sheet ol li::marker {
				font-weight: 800;
				color: #000;
			}
			.sheet .gallery {
				display: grid;
				gap: 8px;
				margin-top: 16px;
				flex: 1;
				min-height: 0;
				overflow: hidden;
			}
			.sheet .cell {
				position: relative;
				min-width: 0;
				min-height: 0;
				overflow: hidden;
				background: #fff;
				border: 3px solid #fff;
				border-radius: 8px;
				box-shadow: 0 4px 10px rgba(74, 48, 0, 0.28);
			}
			.sheet .cell img {
				position: absolute;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
				object-fit: fill;
				max-width: none;
				display: block;
				pointer-events: none;
				user-select: none;
			}
			.sheet .date.ph {
				background: rgba(255, 255, 255, 0.4);
			}
			.sheet .ph {
				color: rgba(61, 41, 0, 0.38);
			}

			.tabs,
			.bottombar {
				display: none;
			}
			@media (max-width: 980px) {
				html,
				body {
					height: auto;
				}
				body {
					padding-bottom: calc(86px + env(safe-area-inset-bottom));
					-webkit-tap-highlight-color: transparent;
				}
				.app {
					display: block;
					height: auto;
				}
				.tabs {
					display: flex;
					gap: 8px;
					position: sticky;
					top: 0;
					z-index: 20;
					background: #fff;
					border-bottom: 1px solid var(--line);
					padding: calc(10px + env(safe-area-inset-top)) 14px 10px;
				}
				.tabs button {
					flex: 1;
					font: inherit;
					font-size: 15px;
					font-weight: 600;
					min-height: 44px;
					border: 0;
					border-radius: 10px;
					background: #eef1f4;
					color: var(--muted);
				}
				.tabs button[aria-selected="true"] {
					background: var(--accent);
					color: #fff;
				}
				.left,
				.right {
					display: none;
					overflow: visible;
					border: 0;
				}
				body[data-tab="edit"] .left {
					display: block;
				}
				body[data-tab="preview"] .right {
					display: block;
				}
				.left {
					padding: 20px 16px 28px;
				}
				.right {
					padding: 16px 12px 24px;
				}
				h2 {
					font-size: 22px;
				}
				input[type="text"],
				input[type="date"],
				textarea {
					font-size: 16px;
					padding: 12px 14px;
					min-height: 48px;
				}
				.person {
					padding: 12px;
					font-size: 15px;
					min-height: 50px;
				}
				.person input {
					width: 22px;
					height: 22px;
				}
				.btn {
					min-height: 48px;
				}
				#addBtn {
					width: 100%;
					margin-bottom: 6px;
				}
				.count {
					display: block;
					margin: 6px 0 0;
				}
				.thumb img {
					width: 64px;
					height: 64px;
				}
				.thumb button {
					min-height: 40px;
					padding: 8px 14px;
					font-size: 14px;
				}
				.desk-only {
					display: none;
				}
				.bottombar {
					display: block;
					position: fixed;
					left: 0;
					right: 0;
					bottom: 0;
					z-index: 30;
					background: rgba(255, 255, 255, 0.96);
					-webkit-backdrop-filter: blur(8px);
					backdrop-filter: blur(8px);
					border-top: 1px solid var(--line);
					padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
				}
				.bottombar .btn-primary {
					padding: 15px;
					font-size: 16px;
					border-radius: 12px;
				}
			}
			select {
				width: 100%;
				font: inherit;
				font-size: 14px;
				padding: 10px 12px;
				border: 1px solid var(--line);
				border-radius: 8px;
				background: #fff;
				color: var(--ink);
				margin-top: 12px;
			}
			.hint {
				font-size: 12.5px;
				color: var(--muted);
				margin: 8px 0 0;
				line-height: 1.45;
			}
			.pwrap {
				flex: none;
				position: relative;
			}
			.paper {
				transform-origin: top left;
			}
			.adjbar {
				display: flex;
				justify-content: center;
				margin: 0 auto 14px;
			}
			.adjbar label {
				display: inline-flex;
				align-items: center;
				gap: 8px;
				background: #fff;
				border: 1px solid var(--line);
				border-radius: 999px;
				padding: 9px 16px;
				font-size: 13px;
				font-weight: 600;
				cursor: pointer;
				box-shadow: 0 1px 3px rgba(20, 30, 40, 0.1);
			}
			.adjbar input {
				width: 18px;
				height: 18px;
				accent-color: var(--accent);
				margin: 0;
			}
			.adjust .cell {
				cursor: move;
				touch-action: none;
			}
			.paper .cell.sel {
				outline: 3px dashed #1f5f5b;
				outline-offset: -4px;
			}
			@media (max-width: 980px) {
				select {
					font-size: 16px;
					min-height: 48px;
				}
				.adjbar label {
					font-size: 12.5px;
					padding: 8px 12px;
				}
			}

				<div class="field">
					<label class="lbl" for="evName">Event name</label>
					<input
						type="text"
						id="evName"
						placeholder="e.g. Scholarship Awards Ceremony"
					/>
				</div>

				<div class="field">
					<label class="lbl" for="evDate">Date</label>
					<input type="date" id="evDate" />
				</div>

				<div class="field">
					<label class="lbl" for="title">Title</label>
					<input
						type="text"
						id="title"
						placeholder="e.g. Project kickoff meeting"
					/>
				</div>

				<div class="field">
					<label class="lbl" for="desc">Description</label>
					<textarea
						id="desc"
						placeholder="What happened, or what is planned?"
					></textarea>
				</div>

				<div class="field">
					<span class="lbl">Participants</span>
					<div class="people" id="people"></div>
				</div>

				<div class="field">
					<span class="lbl">Images</span>
					<button type="button" class="btn btn-outline" id="addBtn">
						Add image
					</button>
					<span class="count" id="count">0 of 9</span>
					<input type="file" id="fileInput" accept="image/*" multiple />
					<div class="note" id="note" role="status"></div>
					<select id="layoutSel" aria-label="Photo layout">
						<option value="collage">
							Layout: Collage (first photo is the hero)
						</option>
						<option value="grid">Layout: Equal grid</option>
					</select>
					<p class="hint">
						Use the arrows to change the order. Drag a photo on the poster to
						move it inside its frame. Use the size slider (or scroll / pinch) to
						zoom and crop.
					</p>
					<div class="thumbs" id="thumbs"></div>
				</div>

				<button type="button" class="btn btn-primary desk-only pdf-btn">
					Print / Download PDF
				</button>
			</aside>

			<!-- RIGHT: LIVE A4 PREVIEW -->
			<main class="right">
				<div class="adjbar">
					<label
						><input type="checkbox" id="adjOn" checked /> Move &amp; crop photos
						(drag to move, scroll or pinch to zoom)</label
					>
				</div>
				<div class="stage">
					<div class="pwrap" id="pwrap">
						<div class="paper adjust" id="paper">
							<div id="sheet" class="sheet">
								<h1 class="ev" id="pEv"></h1>
								<div class="date" id="pDate"></div>
								<h2 class="doc-title" id="pTitle"></h2>
								<div class="bar"></div>
								<p class="doc-desc" id="pDesc"></p>
								<div class="sec" id="pSec">Participants</div>
								<ol id="pList"></ol>
								<div class="gallery" id="pGallery"></div>
							</div>
						</div>
					</div>
				</div>
			</main>
		</div>

		<div class="bottombar">
			<button type="button" class="btn btn-primary pdf-btn">
				Print / Download PDF
			</button>
		</div>

		<script>
			const PEOPLE = [
				"M.D.S. Madushanka",
				"Hasindu Wijekoon",
				"G.P.Peter",
				"R.B.M. Pamuditha",
				"G.U.I. Perera",
			];
			const MAX_IMAGES = 9;
			let images = []; // {id, name, src}
			let nextId = 1;
			let pScale = 1,
				selId = null,
				layoutMode = "collage";

			const $ = (id) => document.getElementById(id);
			const titleEl = $("title"),
				descEl = $("desc"),
				peopleEl = $("people"),
				fileInput = $("fileInput"),
				addBtn = $("addBtn"),
				thumbsEl = $("thumbs"),
				countEl = $("count"),
				noteEl = $("note");

			// Participants checklist (all ticked by default)
			PEOPLE.forEach((name, i) => {
				const row = document.createElement("label");
				row.className = "person";
				row.innerHTML =
					'<input type="checkbox" checked data-name=""><span></span>';
				row.querySelector("input").dataset.name = name;
				row.querySelector("span").textContent = name;
				row.querySelector("input").addEventListener("change", render);
				peopleEl.appendChild(row);
			});

			titleEl.addEventListener("input", render);
			$("evName").addEventListener("input", render);
			$("evDate").addEventListener("input", render);
			const fmtDate = (v) => {
				const [y, m, d] = v.split("-").map(Number);
				return new Date(y, m - 1, d).toLocaleDateString("en-GB", {
					day: "numeric",
					month: "long",
					year: "numeric",
				});
			};
			descEl.addEventListener("input", render);
			addBtn.addEventListener("click", () => fileInput.click());

			fileInput.addEventListener("change", async () => {
				noteEl.textContent = "";
				const files = [...fileInput.files].filter((f) =>
					f.type.startsWith("image/"),
				);
				const room = MAX_IMAGES - images.length;
				if (files.length > room)
					noteEl.textContent = `Only ${MAX_IMAGES} images fit on one page. Extra files were skipped.`;
				for (const f of files.slice(0, room)) {
					const o = await shrink(f);
					if (!o) {
						noteEl.textContent = "One file could not be read as an image.";
						continue;
					}
					images.push({
						id: nextId++,
						name: f.name,
						src: o.src,
						w: o.w,
						h: o.h,
						zoom: 1,
						fx: 0.5,
						fy: 0.5,
					});
				}
				fileInput.value = "";
				render();
			});

			const gal = $("pGallery");
			const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
			const imgById = (id) => images.find((x) => x.id === id);

			// Downscale big phone photos so the PDF renders fast; keep the pixel size for cropping
			function shrink(file) {
				return new Promise((res) => {
					const url = URL.createObjectURL(file),
						im = new Image();
					im.onload = () => {
						const k = Math.min(
							1,
							1600 / Math.max(im.naturalWidth, im.naturalHeight),
						);
						const c = document.createElement("canvas");
						c.width = Math.round(im.naturalWidth * k);
						c.height = Math.round(im.naturalHeight * k);
						const x = c.getContext("2d");
						x.fillStyle = "#fff";
						x.fillRect(0, 0, c.width, c.height);
						x.drawImage(im, 0, 0, c.width, c.height);
						URL.revokeObjectURL(url);
						res({
							src: c.toDataURL("image/jpeg", 0.88),
							w: c.width,
							h: c.height,
						});
					};
					im.onerror = () => {
						URL.revokeObjectURL(url);
						res(null);
					};
					im.src = url;
				});
			}

			function renderThumbs() {
				thumbsEl.innerHTML = "";
				images.forEach((im, idx) => {
					const d = document.createElement("div");
					d.className = "thumb";
					d.innerHTML =
						'<img alt=""><div class="meta"><span class="nm"></span><div class="acts"><button type="button" data-a="up" aria-label="Move earlier">&#9650;</button><button type="button" data-a="down" aria-label="Move later">&#9660;</button><button type="button" class="rm" data-a="rm">Remove</button></div></div><div class="zrow"><span>Size</span><input type="range" min="100" max="400" step="1"><button type="button" data-a="reset">Reset</button></div>';
					d.querySelector("img").src = im.src;
					d.querySelector(".nm").textContent = idx + 1 + ". " + im.name;
					const sl = d.querySelector("input");
					sl.value = Math.round(im.zoom * 100);
					sl.dataset.zoom = im.id;
					sl.addEventListener("input", () => {
						im.zoom = sl.value / 100;
						updateCrop(im.id);
					});
					const up = d.querySelector("[data-a=up]"),
						dn = d.querySelector("[data-a=down]");
					up.disabled = idx === 0;
					dn.disabled = idx === images.length - 1;
					up.onclick = () => {
						[images[idx - 1], images[idx]] = [images[idx], images[idx - 1]];
						render();
					};
					dn.onclick = () => {
						[images[idx + 1], images[idx]] = [images[idx], images[idx + 1]];
						render();
					};
					d.querySelector("[data-a=rm]").onclick = () => {
						images = images.filter((x) => x.id !== im.id);
						noteEl.textContent = "";
						render();
					};
					d.querySelector("[data-a=reset]").onclick = () => {
						im.zoom = 1;
						im.fx = 0.5;
						im.fy = 0.5;
						updateCrop(im.id);
					};
					thumbsEl.appendChild(d);
				});
				countEl.textContent = `${images.length} of ${MAX_IMAGES}`;
				addBtn.disabled = images.length >= MAX_IMAGES;
			}

			// Crop: image is sized in % of its frame (cover-fit x zoom) and offset by pan fractions fx, fy
			function placeCell(cell) {
				const im = imgById(+cell.dataset.id);
				if (!im) return;
				const cw = cell.clientWidth,
					ch = cell.clientHeight;
				if (!cw || !ch) return;
				const k = Math.max(cw / im.w, ch / im.h) * im.zoom,
					w = im.w * k,
					h = im.h * k,
					el = cell.firstChild;
				el.style.width = (w / cw) * 100 + "%";
				el.style.height = (h / ch) * 100 + "%";
				el.style.left = (((cw - w) * im.fx) / cw) * 100 + "%";
				el.style.top = (((ch - h) * im.fy) / ch) * 100 + "%";
			}
			function placeAll() {
				gal.querySelectorAll(".cell").forEach(placeCell);
			}
			function updateCrop(id) {
				const cell = gal.querySelector('.cell[data-id="' + id + '"]');
				if (cell) placeCell(cell);
				const sl = document.querySelector('input[data-zoom="' + id + '"]'),
					im = imgById(id);
				if (sl && im) sl.value = Math.round(im.zoom * 100);
			}

			function gridLayout(n) {
				const cols = n === 1 ? 1 : n === 2 || n === 4 ? 2 : 3,
					rows = Math.ceil(n / cols),
					base = cols === 3 ? 6 : cols,
					span = base / cols,
					m = n - (rows - 1) * cols,
					p = [];
				for (let i = 0; i < n; i++) {
					const r = Math.floor(i / cols),
						c = i % cols;
					if (r === rows - 1 && m < cols) {
						const sp = base / m;
						p.push([c * sp + 1, sp, r + 1, 1]);
					} else p.push([c * span + 1, span, r + 1, 1]);
				}
				return { c: base, r: rows, p };
			}

			const LAYOUTS = {
				1: { c: 1, r: 1, p: [[1, 1, 1, 1]] },
				2: {
					c: 3,
					r: 1,
					p: [
						[1, 2, 1, 1],
						[3, 1, 1, 1],
					],
				},
				3: {
					c: 2,
					r: 2,
					p: [
						[1, 1, 1, 2],
						[2, 1, 1, 1],
						[2, 1, 2, 1],
					],
				},
				4: {
					c: 3,
					r: 2,
					p: [
						[1, 2, 1, 1],
						[3, 1, 1, 1],
						[1, 1, 2, 1],
						[2, 2, 2, 1],
					],
				},
				5: {
					c: 6,
					r: 2,
					p: [
						[1, 4, 1, 1],
						[5, 2, 1, 1],
						[1, 2, 2, 1],
						[3, 2, 2, 1],
						[5, 2, 2, 1],
					],
				},
				6: {
					c: 3,
					r: 3,
					p: [
						[1, 2, 1, 2],
						[3, 1, 1, 1],
						[3, 1, 2, 1],
						[1, 1, 3, 1],
						[2, 1, 3, 1],
						[3, 1, 3, 1],
					],
				},
				7: {
					c: 4,
					r: 3,
					p: [
						[1, 2, 1, 2],
						[3, 1, 1, 1],
						[4, 1, 1, 1],
						[3, 1, 2, 1],
						[4, 1, 2, 1],
						[1, 2, 3, 1],
						[3, 2, 3, 1],
					],
				},
				8: {
					c: 4,
					r: 3,
					p: [
						[1, 2, 1, 2],
						[3, 1, 1, 1],
						[4, 1, 1, 1],
						[3, 1, 2, 1],
						[4, 1, 2, 1],
						[1, 1, 3, 1],
						[2, 1, 3, 1],
						[3, 2, 3, 1],
					],
				},
				9: {
					c: 4,
					r: 3,
					p: [
						[1, 2, 1, 2],
						[3, 1, 1, 1],
						[4, 1, 1, 1],
						[3, 1, 2, 1],
						[4, 1, 2, 1],
						[1, 1, 3, 1],
						[2, 1, 3, 1],
						[3, 1, 3, 1],
						[4, 1, 3, 1],
					],
				},
			};

			function render() {
				const t = titleEl.value.trim(),
					d = descEl.value.trim();
				const ev = $("evName").value.trim(),
					pE = $("pEv");
				pE.textContent = ev || "Event name";
				pE.classList.toggle("ph", !ev);
				const dv = $("evDate").value,
					pDt = $("pDate");
				pDt.textContent = dv ? fmtDate(dv) : "Event date";
				pDt.classList.toggle("ph", !dv);
				const pT = $("pTitle"),
					pD = $("pDesc");
				pT.textContent = t || "Your title appears here";
				pT.classList.toggle("ph", !t);
				pD.textContent = d || "Your description appears here.";
				pD.classList.toggle("ph", !d);

				const chosen = [...peopleEl.querySelectorAll("input:checked")].map(
					(i) => i.dataset.name,
				);
				const list = $("pList");
				list.innerHTML = "";
				chosen.forEach((n) => {
					const li = document.createElement("li");
					li.textContent = n;
					list.appendChild(li);
				});
				$("pSec").style.display = chosen.length ? "" : "none";
				list.style.display = chosen.length ? "" : "none";

				const g = $("pGallery");
				g.innerHTML = "";
				const L =
					layoutMode === "grid"
						? gridLayout(images.length)
						: LAYOUTS[images.length];
				if (L) {
					g.style.gridTemplateColumns = `repeat(${L.c},1fr)`;
					g.style.gridTemplateRows = `repeat(${L.r},1fr)`;
					images.forEach((im, k) => {
						const [c, cs, r, rs] = L.p[k];
						const cell = document.createElement("div");
						cell.className = "cell" + (im.id === selId ? " sel" : "");
						cell.dataset.id = im.id;
						cell.style.gridColumn = `${c} / span ${cs}`;
						cell.style.gridRow = `${r} / span ${rs}`;
						const el = document.createElement("img");
						el.src = im.src;
						el.alt = "";
						el.draggable = false;
						cell.appendChild(el);
						g.appendChild(cell);
					});
				}
				g.style.display = images.length ? "" : "none";
				placeAll();

				renderThumbs();
			}

			// Scale the A4 preview to fit the panel (screen only; the PDF uses an unscaled clone)
			function fitPreview() {
				const mobile = window.matchMedia("(max-width:980px)").matches;
				const avail = mobile
					? document.documentElement.clientWidth - 24
					: document.querySelector(".right").clientWidth - 40;
				pScale = Math.min(1, avail / 794);
				const pw = $("pwrap");
				pw.style.width = 794 * pScale + "px";
				pw.style.height = 1123 * pScale + "px";
				$("paper").style.transform = "scale(" + pScale + ")";
			}
			window.addEventListener("resize", fitPreview);

			// Mobile tabs
			document.querySelectorAll(".tabs button").forEach((b) =>
				b.addEventListener("click", () => {
					document.body.dataset.tab = b.dataset.tab;
					document
						.querySelectorAll(".tabs button")
						.forEach((x) => x.setAttribute("aria-selected", x === b));
					window.scrollTo(0, 0);
					fitPreview();
				}),
			);

			// PDF export: unscaled clone sized to the printable area (A4 minus 0.4in margins)
			document
				.querySelectorAll(".pdf-btn")
				.forEach((b) => b.addEventListener("click", makePdf));
			function makePdf() {
				const btns = [...document.querySelectorAll(".pdf-btn")];
				placeAll();
				const clone = $("sheet").cloneNode(true);
				clone.removeAttribute("id");
				clone
					.querySelectorAll(".sel")
					.forEach((e) => e.classList.remove("sel"));
				clone.querySelectorAll(".ph").forEach((e) => e.remove());
				clone.style.cssText =
					"width:793px;height:1120px;overflow:hidden;display:flex;flex-direction:column;";

				// On phones, briefly widen the layout viewport so html2canvas doesn't clip the A4 sheet
				const vp = document.querySelector("meta[name=viewport]"),
					vpOld = vp.content;
				if (window.innerWidth < 900) vp.content = "width=900";

				const options = {
					margin: 0,
					filename: "event-details.pdf",
					image: { type: "jpeg", quality: 1 },
					html2canvas: { scale: 3, useCORS: true },
					jsPDF: { unit: "in", format: "a4", orientation: "portrait" },
				};

				btns.forEach((b) => {
					b.disabled = true;
					b.textContent = "Creating PDF...";
				});
				const done = () => {
					vp.content = vpOld;
					btns.forEach((b) => {
						b.disabled = false;
						b.textContent = "Print / Download PDF";
					});
				};
				setTimeout(() => {
					(document.fonts ? document.fonts.ready : Promise.resolve())
						.then(() => html2pdf().set(options).from(clone).save())
						.then(done)
						.catch((e) => {
							console.error(e);
							done();
						});
				}, 200);
			}

			// ----- Photo adjusting: drag = move, wheel / pinch = zoom, ▲▼ = reorder -----
			const adjOn = () => $("adjOn").checked;
			$("adjOn").addEventListener("change", () =>
				$("paper").classList.toggle("adjust", adjOn()),
			);
			$("layoutSel").addEventListener("change", (e) => {
				layoutMode = e.target.value;
				render();
			});
			function select(id) {
				selId = id;
				gal
					.querySelectorAll(".cell")
					.forEach((c) => c.classList.toggle("sel", +c.dataset.id === id));
			}

			const pts = new Map();
			let gest = null;
			function startGesture(cell) {
				const im = imgById(+cell.dataset.id),
					p = [...pts.values()];
				if (!im || !p.length) return;
				gest =
					p.length >= 2
						? {
								m: "pinch",
								cell,
								im,
								z0: im.zoom,
								d0: Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y) || 1,
							}
						: {
								m: "pan",
								cell,
								im,
								x: p[0].x,
								y: p[0].y,
								fx: im.fx,
								fy: im.fy,
							};
			}
			gal.addEventListener("pointerdown", (e) => {
				if (!adjOn()) return;
				const cell = e.target.closest(".cell");
				if (!cell) return;
				e.preventDefault();
				select(+cell.dataset.id);
				try {
					cell.setPointerCapture(e.pointerId);
				} catch (_) {}
				pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
				startGesture(cell);
			});
			gal.addEventListener("pointermove", (e) => {
				if (!gest || !pts.has(e.pointerId)) return;
				pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
				const { im, cell } = gest;
				if (gest.m === "pinch") {
					const p = [...pts.values()];
					if (p.length < 2) return;
					im.zoom = clamp(
						(gest.z0 * Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y)) / gest.d0,
						1,
						4,
					);
				} else {
					const cw = cell.clientWidth,
						ch = cell.clientHeight,
						k = Math.max(cw / im.w, ch / im.h) * im.zoom,
						w = im.w * k,
						h = im.h * k;
					const dx = (e.clientX - gest.x) / pScale,
						dy = (e.clientY - gest.y) / pScale;
					im.fx =
						cw - w ? clamp(((cw - w) * gest.fx + dx) / (cw - w), 0, 1) : 0.5;
					im.fy =
						ch - h ? clamp(((ch - h) * gest.fy + dy) / (ch - h), 0, 1) : 0.5;
				}
				updateCrop(im.id);
			});
			const endPtr = (e) => {
				pts.delete(e.pointerId);
				if (!pts.size) gest = null;
				else if (gest) startGesture(gest.cell);
			};
			gal.addEventListener("pointerup", endPtr);
			gal.addEventListener("pointercancel", endPtr);
			gal.addEventListener(
				"wheel",
				(e) => {
					if (!adjOn()) return;
					const cell = e.target.closest(".cell");
					if (!cell) return;
					e.preventDefault();
					const im = imgById(+cell.dataset.id);
					im.zoom = clamp(im.zoom * (e.deltaY < 0 ? 1.08 : 1 / 1.08), 1, 4);
					select(im.id);
					updateCrop(im.id);
				},
				{ passive: false },
			);

			render();
			fitPreview();
			if (document.fonts) document.fonts.ready.then(render);
		</script>
	</body>
</html>
