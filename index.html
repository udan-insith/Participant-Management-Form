<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Event Details</title>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
		<style>
			:root {
				--ink: #1b2430;
				--muted: #6b7686;
				--line: #dfe4ea;
				--bg: #eceff3;
				--accent: #1f5f5b;
				--accent-dark: #164744;
				--danger: #b3372f;
			}
			* {
				box-sizing: border-box;
			}
			html,
			body {
				margin: 0;
				height: 100%;
			}
			body {
				font-family:
					"Segoe UI",
					system-ui,
					-apple-system,
					Roboto,
					Helvetica,
					Arial,
					sans-serif;
				background: var(--bg);
				color: var(--ink);
			}

			.app {
				display: grid;
				grid-template-columns: 400px 1fr;
				height: 100vh;
			}
			.left {
				background: #fff;
				border-right: 1px solid var(--line);
				overflow-y: auto;
				padding: 28px 26px 40px;
			}
			.right {
				overflow: auto;
				padding: 28px 20px 48px;
			}
			.stage {
				display: flex;
				justify-content: center;
			}

			h2 {
				font-size: 20px;
				margin: 0 0 4px;
				letter-spacing: -0.01em;
			}
			.sub {
				color: var(--muted);
				font-size: 13px;
				margin: 0 0 22px;
			}
			.field {
				margin-bottom: 20px;
			}
			label.lbl,
			.lbl {
				display: block;
				font-size: 13px;
				font-weight: 600;
				margin-bottom: 7px;
			}
			input[type="text"],
			textarea {
				width: 100%;
				font: inherit;
				font-size: 14px;
				padding: 10px 12px;
				border: 1px solid var(--line);
				border-radius: 8px;
				background: #fff;
				color: var(--ink);
				transition:
					border-color 0.15s,
					box-shadow 0.15s;
			}
			textarea {
				min-height: 110px;
				resize: vertical;
				line-height: 1.5;
			}
			input:focus,
			textarea:focus {
				outline: none;
				border-color: var(--accent);
				box-shadow: 0 0 0 3px rgba(31, 95, 91, 0.15);
			}
		</style>
	</head>
	<body></body>
</html>
