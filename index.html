<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover"
		/>
		<meta name="theme-color" content="#1f5f5b" />
		<title>Event Details PDF Builder</title>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
		<style>
			:root {
				--ink: #1b2430;
				--muted: #6b7686;
				--line: #dfe4ea;
				--bg: #eceff3;
				--accent: #1f5f5b;
				--accent-dark: #164744;
				--danger: #b3372f;
			}
			* {
				box-sizing: border-box;
			}
			html,
			body {
				margin: 0;
				height: 100%;
			}
			body {
				font-family:
					"Segoe UI",
					system-ui,
					-apple-system,
					Roboto,
					Helvetica,
					Arial,
					sans-serif;
				background: var(--bg);
				color: var(--ink);
			}

			.app {
				display: grid;
				grid-template-columns: 400px 1fr;
				height: 100vh;
			}
			.left {
				background: #fff;
				border-right: 1px solid var(--line);
				overflow-y: auto;
				padding: 28px 26px 40px;
			}
			.right {
				overflow: auto;
				padding: 28px 20px 48px;
			}
			.stage {
				display: flex;
				justify-content: center;
			}

			h2 {
				font-size: 20px;
				margin: 0 0 4px;
				letter-spacing: -0.01em;
			}
			.sub {
				color: var(--muted);
				font-size: 13px;
				margin: 0 0 22px;
			}
			.field {
				margin-bottom: 20px;
			}
			label.lbl,
			.lbl {
				display: block;
				font-size: 13px;
				font-weight: 600;
				margin-bottom: 7px;
			}
			input[type="text"],
			textarea {
				width: 100%;
				font: inherit;
				font-size: 14px;
				padding: 10px 12px;
				border: 1px solid var(--line);
				border-radius: 8px;
				background: #fff;
				color: var(--ink);
				transition:
					border-color 0.15s,
					box-shadow 0.15s;
			}
			textarea {
				min-height: 110px;
				resize: vertical;
				line-height: 1.5;
			}
			input:focus,
			textarea:focus {
				outline: none;
				border-color: var(--accent);
				box-shadow: 0 0 0 3px rgba(31, 95, 91, 0.15);
			}

			.people {
				display: flex;
				flex-direction: column;
				gap: 6px;
			}
			.person {
				display: flex;
				align-items: center;
				gap: 10px;
				padding: 8px 10px;
				border: 1px solid var(--line);
				border-radius: 8px;
				font-size: 14px;
				cursor: pointer;
			}
			.person:hover {
				background: #f7f9fb;
			}
			.person input {
				width: 17px;
				height: 17px;
				accent-color: var(--accent);
				margin: 0;
			}

			.btn {
				font: inherit;
				font-size: 14px;
				font-weight: 600;
				border: 0;
				border-radius: 8px;
				padding: 10px 16px;
				cursor: pointer;
				transition:
					background 0.15s,
					opacity 0.15s;
			}
			.btn:focus-visible {
				outline: 3px solid rgba(31, 95, 91, 0.35);
				outline-offset: 2px;
			}
			.btn-outline {
				background: #fff;
				color: var(--accent);
				border: 1.5px solid var(--accent);
			}
			.btn-outline:hover {
				background: #eef6f5;
			}
			.btn-outline:disabled {
				opacity: 0.45;
				cursor: not-allowed;
				background: #fff;
			}
			.btn-primary {
				width: 100%;
				background: var(--accent);
				color: #fff;
				padding: 14px 16px;
				font-size: 15px;
			}
			.btn-primary:hover {
				background: var(--accent-dark);
			}
			.btn-primary:disabled {
				opacity: 0.6;
				cursor: wait;
			}
			.count {
				font-size: 12.5px;
				color: var(--muted);
				margin-left: 10px;
			}

			.thumbs {
				display: flex;
				flex-direction: column;
				gap: 8px;
				margin-top: 12px;
			}
			.thumb {
				display: flex;
				align-items: center;
				gap: 12px;
				padding: 6px;
				border: 1px solid var(--line);
				border-radius: 8px;
			}
			.thumb img {
				width: 56px;
				height: 56px;
				object-fit: cover;
				border-radius: 6px;
				flex: none;
			}
			.thumb .nm {
				flex: 1;
				min-width: 0;
				font-size: 13px;
				color: var(--muted);
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
			}
			.thumb button {
				background: none;
				border: 1px solid #e7c4c1;
				color: var(--danger);
				border-radius: 6px;
				padding: 6px 10px;
				font: inherit;
				font-size: 12.5px;
				font-weight: 600;
				cursor: pointer;
			}
			.thumb button:hover {
				background: #fbeeed;
			}
			#fileInput {
				display: none;
			}
			.note {
				font-size: 12.5px;
				color: var(--danger);
				min-height: 16px;
				margin-top: 8px;
			}

			/* ---------- A4 page (794 x 1123 px @96dpi) ---------- */
			.paper {
				width: 794px;
				height: 1123px;
				padding: 38px;
				background: #fff;
				flex: none;
				box-shadow:
					0 1px 3px rgba(20, 30, 40, 0.12),
					0 14px 40px rgba(20, 30, 40, 0.16);
			}
			.sheet {
				width: 100%;
				height: 100%;
				display: flex;
				flex-direction: column;
				overflow: hidden;
				background: #fff;
				color: #1b2430;
			}
			.sheet .doc-title {
				font-size: 30px;
				line-height: 1.15;
				font-weight: 700;
				letter-spacing: -0.02em;
				margin: 0;
				overflow-wrap: anywhere;
			}
			.sheet .bar {
				height: 3px;
				width: 100%;
				background: var(--accent);
				margin: 14px 0 16px;
				border-radius: 2px;
				flex: none;
			}
			.sheet .doc-desc {
				font-size: 13.5px;
				line-height: 1.6;
				white-space: pre-wrap;
				overflow-wrap: anywhere;
				margin: 0;
				color: #2f3a48;
			}
			.sheet .sec {
				font-size: 13px;
				font-weight: 700;
				margin: 20px 0 8px;
				padding-bottom: 6px;
				border-bottom: 1px solid var(--line);
				flex: none;
			}
			.sheet ol {
				margin: 0;
				padding-left: 22px;
				font-size: 13.5px;
				line-height: 1.75;
			}
			.sheet ol li::marker {
				color: var(--accent);
				font-weight: 600;
			}
			.sheet .gallery {
				display: grid;
				gap: 10px;
				margin-top: 18px;
				flex: 1;
				min-height: 0;
				overflow: hidden;
				align-content: start;
				grid-template-columns: repeat(var(--cols, 1), 1fr);
			}
			.sheet .gallery img {
				display: block;
				width: 100%;
				height: var(--h, 200px);
				object-fit: cover;
				border-radius: 6px;
			}
			.ph {
				color: #a6afbb;
			}

			.tabs,
			.bottombar {
				display: none;
			}
			@media (max-width: 980px) {
				html,
				body {
					height: auto;
				}
				body {
					padding-bottom: calc(86px + env(safe-area-inset-bottom));
					-webkit-tap-highlight-color: transparent;
				}
				.app {
					display: block;
					height: auto;
				}
				.tabs {
					display: flex;
					gap: 8px;
					position: sticky;
					top: 0;
					z-index: 20;
					background: #fff;
					border-bottom: 1px solid var(--line);
					padding: calc(10px + env(safe-area-inset-top)) 14px 10px;
				}
				.tabs button {
					flex: 1;
					font: inherit;
					font-size: 15px;
					font-weight: 600;
					min-height: 44px;
					border: 0;
					border-radius: 10px;
					background: #eef1f4;
					color: var(--muted);
				}
				.tabs button[aria-selected="true"] {
					background: var(--accent);
					color: #fff;
				}
				.left,
				.right {
					display: none;
					overflow: visible;
					border: 0;
				}
				body[data-tab="edit"] .left {
					display: block;
				}
				body[data-tab="preview"] .right {
					display: block;
				}
				.left {
					padding: 20px 16px 28px;
				}
				.right {
					padding: 16px 12px 24px;
				}
				h2 {
					font-size: 22px;
				}
				input[type="text"],
				textarea {
					font-size: 16px;
					padding: 12px 14px;
				}
				.person {
					padding: 12px;
					font-size: 15px;
					min-height: 50px;
				}
				.person input {
					width: 22px;
					height: 22px;
				}
				.btn {
					min-height: 48px;
				}
				#addBtn {
					width: 100%;
					margin-bottom: 6px;
				}
				.count {
					display: block;
					margin: 6px 0 0;
				}
				.thumb img {
					width: 64px;
					height: 64px;
				}
				.thumb button {
					min-height: 40px;
					padding: 8px 14px;
					font-size: 14px;
				}
				.desk-only {
					display: none;
				}
				.bottombar {
					display: block;
					position: fixed;
					left: 0;
					right: 0;
					bottom: 0;
					z-index: 30;
					background: rgba(255, 255, 255, 0.96);
					-webkit-backdrop-filter: blur(8px);
					backdrop-filter: blur(8px);
					border-top: 1px solid var(--line);
					padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
				}
				.bottombar .btn-primary {
					padding: 15px;
					font-size: 16px;
					border-radius: 12px;
				}
			}
		</style>
	</head>
	<body data-tab="edit">
		<nav class="tabs" role="tablist">
			<button type="button" role="tab" data-tab="edit" aria-selected="true">
				Edit
			</button>
			<button type="button" role="tab" data-tab="preview" aria-selected="false">
				Preview
			</button>
		</nav>

		<div class="app">
			<!-- LEFT: FORM -->
			<aside class="left">
				<h2>Event details</h2>
				<p class="sub">
					Fill in the form. The page on the right updates as you type.
				</p>

				<div class="field">
					<label class="lbl" for="title">Title</label>
					<input
						type="text"
						id="title"
						placeholder="e.g. Project kickoff meeting"
					/>
				</div>

				<div class="field">
					<label class="lbl" for="desc">Description</label>
					<textarea
						id="desc"
						placeholder="What happened, or what is planned?"
					></textarea>
				</div>

				<div class="field">
					<span class="lbl">Participants</span>
					<div class="people" id="people"></div>
				</div>

				<div class="field">
					<span class="lbl">Images</span>
					<button type="button" class="btn btn-outline" id="addBtn">
						Add image
					</button>
					<span class="count" id="count">0 of 9</span>
					<input type="file" id="fileInput" accept="image/*" multiple />
					<div class="note" id="note" role="status"></div>
					<div class="thumbs" id="thumbs"></div>
				</div>

				<button type="button" class="btn btn-primary desk-only pdf-btn">
					Print / Download PDF
				</button>
			</aside>

			<!-- RIGHT: LIVE A4 PREVIEW -->
			<main class="right">
				<div class="stage">
					<div class="paper" id="paper">
						<div id="sheet" class="sheet">
							<h1 class="doc-title" id="pTitle"></h1>
							<div class="bar"></div>
							<p class="doc-desc" id="pDesc"></p>
							<div class="sec" id="pSec">Participants</div>
							<ol id="pList"></ol>
							<div class="gallery" id="pGallery"></div>
						</div>
					</div>
				</div>
			</main>
		</div>

		<div class="bottombar">
			<button type="button" class="btn btn-primary pdf-btn">
				Print / Download PDF
			</button>
		</div>

		<script>
			const PEOPLE = [
				"M.D.S. Madushanka",
				"Hasindu Wijekoon",
				"G.P.Peter",
				"R.B.M. Pamuditha",
				"G.U.I. Perera",
			];
			const MAX_IMAGES = 9;
			let images = []; // {id, name, src}
			let nextId = 1;

			const $ = (id) => document.getElementById(id);
			const titleEl = $("title"),
				descEl = $("desc"),
				peopleEl = $("people"),
				fileInput = $("fileInput"),
				addBtn = $("addBtn"),
				thumbsEl = $("thumbs"),
				countEl = $("count"),
				noteEl = $("note");

			// Participants checklist (all ticked by default)
			PEOPLE.forEach((name, i) => {
				const row = document.createElement("label");
				row.className = "person";
				row.innerHTML =
					'<input type="checkbox" checked data-name=""><span></span>';
				row.querySelector("input").dataset.name = name;
				row.querySelector("span").textContent = name;
				row.querySelector("input").addEventListener("change", render);
				peopleEl.appendChild(row);
			});

			titleEl.addEventListener("input", render);
			descEl.addEventListener("input", render);
			addBtn.addEventListener("click", () => fileInput.click());

			fileInput.addEventListener("change", async () => {
				noteEl.textContent = "";
				const files = [...fileInput.files].filter((f) =>
					f.type.startsWith("image/"),
				);
				const room = MAX_IMAGES - images.length;
				if (files.length > room)
					noteEl.textContent = `Only ${MAX_IMAGES} images fit on one page. Extra files were skipped.`;
				for (const f of files.slice(0, room)) {
					const src = await shrink(f);
					images.push({ id: nextId++, name: f.name, src });
				}
				fileInput.value = "";
				render();
			});

			// Downscale big phone photos so the PDF renders fast and memory stays low
			function shrink(file) {
				return new Promise((res) => {
					const url = URL.createObjectURL(file),
						im = new Image();
					im.onload = () => {
						const k = Math.min(
							1,
							1600 / Math.max(im.naturalWidth, im.naturalHeight),
						);
						const c = document.createElement("canvas");
						c.width = Math.round(im.naturalWidth * k);
						c.height = Math.round(im.naturalHeight * k);
						const x = c.getContext("2d");
						x.fillStyle = "#fff";
						x.fillRect(0, 0, c.width, c.height);
						x.drawImage(im, 0, 0, c.width, c.height);
						URL.revokeObjectURL(url);
						res(c.toDataURL("image/jpeg", 0.85));
					};
					im.onerror = () => {
						URL.revokeObjectURL(url);
						const r = new FileReader();
						r.onload = () => res(r.result);
						r.readAsDataURL(file);
					};
					im.src = url;
				});
			}

			function renderThumbs() {
				thumbsEl.innerHTML = "";
				images.forEach((img) => {
					const d = document.createElement("div");
					d.className = "thumb";
					const im = document.createElement("img");
					im.src = img.src;
					im.alt = "";
					const nm = document.createElement("span");
					nm.className = "nm";
					nm.textContent = img.name;
					const b = document.createElement("button");
					b.type = "button";
					b.textContent = "Remove";
					b.addEventListener("click", () => {
						images = images.filter((x) => x.id !== img.id);
						noteEl.textContent = "";
						render();
					});
					d.append(im, nm, b);
					thumbsEl.appendChild(d);
				});
				countEl.textContent = `${images.length} of ${MAX_IMAGES}`;
				addBtn.disabled = images.length >= MAX_IMAGES;
			}

			// Image layout by count: [columns, image height in px]
			function layoutFor(n) {
				if (n <= 1) return [1, 400];
				if (n === 2) return [2, 300];
				if (n === 3) return [3, 230];
				if (n === 4) return [2, 220];
				if (n <= 6) return [3, 150];
				return [3, 120];
			}

			function render() {
				const t = titleEl.value.trim(),
					d = descEl.value.trim();
				const pT = $("pTitle"),
					pD = $("pDesc");
				pT.textContent = t || "Your title appears here";
				pT.classList.toggle("ph", !t);
				pD.textContent = d || "Your description appears here.";
				pD.classList.toggle("ph", !d);

				const chosen = [...peopleEl.querySelectorAll("input:checked")].map(
					(i) => i.dataset.name,
				);
				const list = $("pList");
				list.innerHTML = "";
				chosen.forEach((n) => {
					const li = document.createElement("li");
					li.textContent = n;
					list.appendChild(li);
				});
				$("pSec").style.display = chosen.length ? "" : "none";
				list.style.display = chosen.length ? "" : "none";

				const g = $("pGallery");
				g.innerHTML = "";
				const [cols, h] = layoutFor(images.length);
				g.style.setProperty("--cols", cols);
				g.style.setProperty("--h", h + "px");
				images.forEach((i) => {
					const im = document.createElement("img");
					im.src = i.src;
					im.alt = "";
					g.appendChild(im);
				});
				g.style.display = images.length ? "" : "none";

				renderThumbs();
			}

			// Scale the A4 preview to fit the panel (screen only; the PDF uses an unscaled clone)
			function fitPreview() {
				const mobile = window.matchMedia("(max-width:980px)").matches;
				const avail = mobile
					? document.documentElement.clientWidth - 24
					: document.querySelector(".right").clientWidth - 40;
				$("paper").style.zoom = Math.min(1, avail / 794);
			}
			window.addEventListener("resize", fitPreview);

			// Mobile tabs
			document.querySelectorAll(".tabs button").forEach((b) =>
				b.addEventListener("click", () => {
					document.body.dataset.tab = b.dataset.tab;
					document
						.querySelectorAll(".tabs button")
						.forEach((x) => x.setAttribute("aria-selected", x === b));
					window.scrollTo(0, 0);
					fitPreview();
				}),
			);

			// PDF export: unscaled clone sized to the printable area (A4 minus 0.4in margins)
			document
				.querySelectorAll(".pdf-btn")
				.forEach((b) => b.addEventListener("click", makePdf));
			function makePdf() {
				const btns = [...document.querySelectorAll(".pdf-btn")];
				const clone = $("sheet").cloneNode(true);
				clone.removeAttribute("id");
				clone.querySelectorAll(".ph").forEach((e) => e.remove());
				clone.style.cssText =
					"width:717px;height:1040px;overflow:hidden;background:#fff;display:flex;flex-direction:column;";

				const wrap = document.createElement("div");
				wrap.style.cssText = "position:fixed;left:-10000px;top:0;";
				wrap.appendChild(clone);
				document.body.appendChild(wrap);

				const options = {
					margin: 0.4,
					filename: "event-details.pdf",
					image: { type: "jpeg", quality: 0.98 },
					html2canvas: {
						scale: 2,
						useCORS: true,
						windowWidth: 1024,
						scrollX: 0,
						scrollY: 0,
					},
					jsPDF: { unit: "in", format: "a4", orientation: "portrait" },
				};

				btns.forEach((b) => {
					b.disabled = true;
					b.textContent = "Creating PDF...";
				});
				const done = () => {
					wrap.remove();
					btns.forEach((b) => {
						b.disabled = false;
						b.textContent = "Print / Download PDF";
					});
				};
				html2pdf()
					.set(options)
					.from(clone)
					.save()
					.then(done)
					.catch((e) => {
						console.error(e);
						done();
					});
			}

			render();
			fitPreview();
		</script>
	</body>
</html>
