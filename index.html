<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Event Details</title>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
		<style>
			:root {
				--ink: #1b2430;
				--muted: #6b7686;
				--line: #dfe4ea;
				--bg: #eceff3;
				--accent: #1f5f5b;
				--accent-dark: #164744;
				--danger: #b3372f;
			}
			* {
				box-sizing: border-box;
			}
			html,
			body {
				margin: 0;
				height: 100%;
			}
			body {
				font-family:
					"Segoe UI",
					system-ui,
					-apple-system,
					Roboto,
					Helvetica,
					Arial,
					sans-serif;
				background: var(--bg);
				color: var(--ink);
			}

			.app {
				display: grid;
				grid-template-columns: 400px 1fr;
				height: 100vh;
			}
			.left {
				background: #fff;
				border-right: 1px solid var(--line);
				overflow-y: auto;
				padding: 28px 26px 40px;
			}
			.right {
				overflow: auto;
				padding: 28px 20px 48px;
			}
			.stage {
				display: flex;
				justify-content: center;
			}

			h2 {
				font-size: 20px;
				margin: 0 0 4px;
				letter-spacing: -0.01em;
			}
			.sub {
				color: var(--muted);
				font-size: 13px;
				margin: 0 0 22px;
			}
			.field {
				margin-bottom: 20px;
			}
			label.lbl,
			.lbl {
				display: block;
				font-size: 13px;
				font-weight: 600;
				margin-bottom: 7px;
			}
			input[type="text"],
			textarea {
				width: 100%;
				font: inherit;
				font-size: 14px;
				padding: 10px 12px;
				border: 1px solid var(--line);
				border-radius: 8px;
				background: #fff;
				color: var(--ink);
				transition:
					border-color 0.15s,
					box-shadow 0.15s;
			}
			textarea {
				min-height: 110px;
				resize: vertical;
				line-height: 1.5;
			}
			input:focus,
			textarea:focus {
				outline: none;
				border-color: var(--accent);
				box-shadow: 0 0 0 3px rgba(31, 95, 91, 0.15);
			}
			.people {
				display: flex;
				flex-direction: column;
				gap: 6px;
			}
			.person {
				display: flex;
				align-items: center;
				gap: 10px;
				padding: 8px 10px;
				border: 1px solid var(--line);
				border-radius: 8px;
				font-size: 14px;
				cursor: pointer;
			}
			.person:hover {
				background: #f7f9fb;
			}
			.person input {
				width: 17px;
				height: 17px;
				accent-color: var(--accent);
				margin: 0;
			}

			.btn {
				font: inherit;
				font-size: 14px;
				font-weight: 600;
				border: 0;
				border-radius: 8px;
				padding: 10px 16px;
				cursor: pointer;
				transition:
					background 0.15s,
					opacity 0.15s;
			}
			.btn:focus-visible {
				outline: 3px solid rgba(31, 95, 91, 0.35);
				outline-offset: 2px;
			}
			.btn-outline {
				background: #fff;
				color: var(--accent);
				border: 1.5px solid var(--accent);
			}
			.btn-outline:hover {
				background: #eef6f5;
			}
			.btn-outline:disabled {
				opacity: 0.45;
				cursor: not-allowed;
				background: #fff;
			}
			.btn-primary {
				width: 100%;
				background: var(--accent);
				color: #fff;
				padding: 14px 16px;
				font-size: 15px;
			}
			.btn-primary:hover {
				background: var(--accent-dark);
			}
			.btn-primary:disabled {
				opacity: 0.6;
				cursor: wait;
			}
			.count {
				font-size: 12.5px;
				color: var(--muted);
				margin-left: 10px;
			}
			.thumbs {
				display: flex;
				flex-direction: column;
				gap: 8px;
				margin-top: 12px;
			}
			.thumb {
				display: flex;
				align-items: center;
				gap: 12px;
				padding: 6px;
				border: 1px solid var(--line);
				border-radius: 8px;
			}
			.thumb img {
				width: 56px;
				height: 56px;
				object-fit: cover;
				border-radius: 6px;
				flex: none;
			}
			.thumb .nm {
				flex: 1;
				min-width: 0;
				font-size: 13px;
				color: var(--muted);
				white-space: nowrap;
				overflow: hidden;
				text-overflow: ellipsis;
			}
			.thumb button {
				background: none;
				border: 1px solid #e7c4c1;
				color: var(--danger);
				border-radius: 6px;
				padding: 6px 10px;
				font: inherit;
				font-size: 12.5px;
				font-weight: 600;
				cursor: pointer;
			}
			.thumb button:hover {
				background: #fbeeed;
			}
			#fileInput {
				display: none;
			}
			.note {
				font-size: 12.5px;
				color: var(--danger);
				min-height: 16px;
				margin-top: 8px;
			}
		</style>
	</head>
	<body></body>
</html>
